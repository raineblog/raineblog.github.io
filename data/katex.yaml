macros:
  # 数学符号
  "\\i": "\\mathrm{i}"
  "\\d": "\\mathrm{d}"
  "\\C": "\\mathbb{C}"
  "\\R": "\\mathbb{R}"
  "\\Q": "\\mathbb{Q}"
  "\\Z": "\\mathbb{Z}"
  "\\N": "\\mathbb{N}"
  "\\P": "\\mathbb{P}"
  "\\vec": "\\bm"
  
  # 中文标点自动替换
  "‘": "'"
  "’": "'"
  "，": ","
  "。": "."
  "；": ";"
  "：": ":"
  "！": "!"
  "？": "?"
  "【": "["
  "】": "]"
  "（": "("
  "）": ")"
  "、": ","
  "—": "-"
  "…": "\\dots"
  "·": "\\cdot"